<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Шапка лендинга — предпросмотр</title>
  <!-- Bootstrap подключается в вашей системе. Для предпросмотра — CDN: -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Подключаем FontAwesome для иконок соцсетей (так как в Bootstrap нет иконки VK) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="/header.css" rel="stylesheet" />
</head>
<body>
<!-- Ваш шаблон: содержимое ниже выводится из CMS внутрь .landing-content -->
<div class="landing-content">

  <!-- ======================= ШАПКА ЛЕНДИНГА (вставить в CMS) ======================= -->
  <header class="lp-header">
    <nav class="navbar navbar-expand-lg lp-navbar" aria-label="Основная навигация">
      <div class="container-fluid lp-container">

        <!-- Логотип (заменен на простую PNG картинку) -->
        <a class="navbar-brand lp-brand" href="#" aria-label="ХОРОШО — на главную">
          <img class="lp-logo" src="logo.png" alt="ХОРОШО" />
        </a>

        <!-- Переключатель мобильного меню (штатный коллапс Bootstrap) -->
        <button
          class="navbar-toggler lp-toggler collapsed"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#lpHeaderNav"
          aria-controls="lpHeaderNav"
          aria-expanded="false"
          aria-label="Открыть меню"
        >
          <span class="lp-toggler-bar"></span>
          <span class="lp-toggler-bar"></span>
          <span class="lp-toggler-bar"></span>
        </button>

        <!-- Меню -->
        <div class="collapse navbar-collapse lp-collapse" id="lpHeaderNav">
          <ul class="navbar-nav lp-nav">
            <li class="nav-item"><a class="nav-link lp-nav-link" href="#about">Обо мне</a></li>
            <li class="nav-item"><a class="nav-link lp-nav-link" href="#movement">Движение</a></li>
            <li class="nav-item"><a class="nav-link lp-nav-link" href="#breath">Дыхание</a></li>
            <li class="nav-item"><a class="nav-link lp-nav-link" href="#reviews">Отзывы</a></li>
          </ul>

          <!-- Соцсети (иконки заменены на FontAwesome) -->
          <ul class="lp-socials list-unstyled" aria-label="Социальные сети">
            <li>
              <a class="lp-social" href="https://t.me/" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                <i class="fa-brands fa-telegram fa-xl"></i>
              </a>
            </li>
            <li>
              <a class="lp-social lp-social--boxed" href="https://vk.com/" target="_blank" rel="noopener noreferrer" aria-label="ВКонтакте">
                <i class="fa-brands fa-vk fa-xl"></i>
              </a>
            </li>
            <li>
              <a class="lp-social lp-social--boxed" href="https://youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                <i class="fa-brands fa-youtube fa-xl"></i>
              </a>
            </li>
          </ul>

          <!-- Телефон -->
          <a class="lp-phone" href="tel:+79194910248">
            <i class="fa-solid fa-phone lp-phone-icon"></i>
            <span class="lp-phone-number">+79194910248</span>
          </a>

          <!-- Кнопка записи -->
          <a class="btn lp-cta" href="#signup" role="button">Запись на&nbsp;йогу</a>
        </div>

      </div>
    </nav>
  </header>
  <!-- ======================= /ШАПКА ЛЕНДИНГА ======================= -->

</div>

<!-- В вашей системе bootstrap.bundle.min.js уже подключён. Для предпросмотра — CDN: -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
