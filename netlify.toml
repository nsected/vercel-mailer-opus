[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/send-lead"
  to = "/.netlify/functions/api/send-lead"
  status = 200
  force = true

[[redirects]]
  from = "/send-lead-course"
  to = "/.netlify/functions/api/send-lead-course"
  status = 200
  force = true
